333332,667 L 1070.6133333333332,672 L 1063.6133333333332,677 Z" fill="#8496A8"/><rect x="1077.6133333333332" y="654" width="235.51333333333332" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="1195.37" y="676.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">처음부터 순서대로 추적</text><path d="M 1320.1266666666666,672 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 1329.1266666666666,667 L 1336.1266666666666,672 L 1329.1266666666666,677 Z" fill="#8496A8"/><rect x="1343.1266666666666" y="654" width="182.87333333333333" height="36" rx="18" ry="18" fill="#C53030"/><text x="1434.5633333333333" y="676.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">원인 특정 지연</text><rect x="838.0" y="712" width="688.0" height="46" rx="9" ry="9" fill="#FFF8EC" stroke="#F6D8A8" stroke-width="1"/><text x="856.0" y="739.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">영향</text><path d="M 898.0,726 v 18" stroke="#F6D8A8" stroke-width="1.2"/><text x="912.0" y="739.725" font-family="NanumGothic" font-size="15" font-weight="700" fill="#0F2D4A" text-anchor="start">장애 원인을 찾는 동안 대응이 늦어짐</text><rect x="48" y="800" width="1504" height="48" rx="9" ry="9" fill="#0F2D4A"/><circle cx="76" cy="824" r="10" fill="#B45309"/><text x="76" y="828.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text><text x="98" y="828.725" font-family="NanumGothic" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">형상관리 · 배포 검증 · 로그 분석을 모두 사람에 의존 — 작은 실수가 그대로 대고객 장애로 연결</text><text x="48" y="876" font-family="NanumGothic" font-size="12.5" font-weight="400" fill="#8496A8" text-anchor="start">※ 시나리오 디자이너 : 인티큐브 ARS 시나리오 개발 솔루션</text></svg>