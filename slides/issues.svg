.2"/><text x="624.74" y="512.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#51657A" text-anchor="start">요건이 겹칠수록 증가</text><path d="M 74.0,550 L 762.0,550" stroke="#E3E9EF" stroke-width="1"/><circle cx="78.0" cy="584" r="2.8" fill="#B45309"/><text x="90.0" y="588.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">프로젝트 · 신규 업무 요건이 겹치면 같은 시나리오를 동시에 수정</text><circle cx="78.0" cy="616" r="2.8" fill="#B45309"/><text x="90.0" y="620.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">이번 배포 대상이 아닌 수정분 포함 · 필요한 수정분 누락 가능</text><rect x="74.0" y="654" width="232.9" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="190.45" y="676.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">프로젝트 요건 + 신규 요건</text><path d="M 313.9,672 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 322.9,667 L 329.9,672 L 322.9,677 Z" fill="#8496A8"/><rect x="336.9" y="654" width="222.68" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="448.24" y="676.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">같은 시나리오 동시 수정</text><path d="M 566.5799999999999,672 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 575.5799999999999,667 L 582.5799999999999,672 L 575.5799999999999,677 Z" fill="#8496A8"/><rect x="589.5799999999999" y="654" width="172.42000000000002" height="36" rx="18" ry="18" fill="#C53030"/><text x="675.79" y="676.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">혼재 · 누락 배포</text><rect x="74.0" y="712" width="688.0" height="46" rx="9" ry="9" fill="#FFF8EC" stroke="#F6D8A8" stroke-width="1"/><text x="92.0" y="739.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">영향</text><