<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="0" ry="0" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="100" rx="0" ry="0" fill="#0F2D4A"/><text x="48" y="52" font-family="NanumGothic" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start">현황 및 문제점</text><text x="48" y="78" font-family="NanumGothic" font-size="14" font-weight="400" fill="#93AABF" text-anchor="start">솔루션 기반 ARS 시나리오 운영의 구조적 한계</text><text x="1552" y="66" font-family="NanumGothic" font-size="13" font-weight="400" fill="#93AABF" text-anchor="end">시나리오 XML 약 740개 · ARS 7대 · AICC/VGW 3대</text><rect x="48.0" y="120" width="740.0" height="320" rx="12" ry="12" fill="#FFFFFF" stroke="#E3E9EF" stroke-width="1"/><circle cx="91.0" cy="168" r="17" fill="#B45309"/><text x="91.0" y="173.04" font-family="NanumGothic" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="120.0" y="174.93" font-family="NanumGothic" font-size="22" font-weight="700" fill="#0F2D4A" text-anchor="start">형상관리 도구 부재</text><rect x="566.71" y="144" width="195.29" height="48" rx="10" ry="10" fill="#FFF8EC" stroke="#F6D8A8" stroke-width="1"/><text x="586.71" y="175.56" font-family="NanumGothic" font-size="24" font-weight="700" fill="#B45309" text-anchor="start">740개</text><path d="M 659.47,157 v 22" stroke="#F6D8A8" stroke-width="1.2"/><text x="666.47" y="172.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#51657A" text-anchor="start">시나리오 XML</text><path d="M 74.0,210 L 762.0,210" stroke="#E3E9EF" stroke-width="1"/><circle cx="78.0" cy="244" r="2.8" fill="#B45309"/><text x="90.0" y="248.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">솔루션 기반 제품(시나리오 디자이너) 운영으로 고객사 형상관리 연동 불가</text><circle cx="78.0" cy="276" r="2.8" fill="#B45309"/><text x="90.0" y="280.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">소스 비교 · 이력 관리 도구 없이 XML 파일을 한 개씩 대조</text><rect x="74.0" y="314" width="190.99333333333334" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="169.49666666666667" y="336.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">XML 약 740개</text><path d="M 271.99333333333334,332 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 280.99333333333334,327 L 287.99333333333334,332 L 280.99333333333334,337 Z" fill="#8496A8"/><rect x="294.99333333333334" y="314" width="223.89333333333332" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="406.94" y="336.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">파일 단위 개별 대조</text><path d="M 525.8866666666667,332 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 534.8866666666667,327 L 541.8866666666667,332 L 534.8866666666667,337 Z" fill="#8496A8"/><rect x="548.8866666666667" y="314" width="213.11333333333334" height="36" rx="18" ry="18" fill="#C53030"/><text x="655.4433333333334" y="336.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">비교 · 검증 장시간</text><rect x="74.0" y="372" width="688.0" height="46" rx="9" ry="9" fill="#FFF8EC" stroke="#F6D8A8" stroke-width="1"/><text x="92.0" y="399.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">영향</text><path d="M 134.0,386 v 18" stroke="#F6D8A8" stroke-width="1.2"/><text x="148.0" y="399.725" font-family="NanumGothic" font-size="15" font-weight="700" fill="#0F2D4A" text-anchor="start">배포 전 검증 품질이 담당자의 시간과 경험에 좌우</text><rect x="812.0" y="120" width="740.0" height="320" rx="12" ry="12" fill="#FFFFFF" stroke="#E3E9EF" stroke-width="1"/><circle cx="855.0" cy="168" r="17" fill="#B45309"/><text x="855.0" y="173.04" font-family="NanumGothic" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="884.0" y="174.93" font-family="NanumGothic" font-size="22" font-weight="700" fill="#0F2D4A" text-anchor="start">잘못된 배포 = 즉시 대고객 장애</text><rect x="1284.38" y="144" width="241.61999999999998" height="48" rx="10" ry="10" fill="#FFF8EC" stroke="#F6D8A8" stroke-width="1"/><text x="1304.38" y="175.56" font-family="NanumGothic" font-size="24" font-weight="700" fill="#C53030" text-anchor="start">Critical</text><path d="M 1406.18,157 v 22" stroke="#F6D8A8" stroke-width="1.2"/><text x="1413.18" y="172.095" font-family="NanumGothic" font-size="13" font-weight="700" fill="#51657A" text-anchor="start">대고객 업무 중단</text><path d="M 838.0,210 L 1526.0,210" stroke="#E3E9EF" stroke-width="1"/><circle cx="842.0" cy="244" r="2.8" fill="#B45309"/><text x="854.0" y="248.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">소스 형상관리가 담당자 경험과 기억에 의존</text><circle cx="842.0" cy="276" r="2.8" fill="#B45309"/><text x="854.0" y="280.725" font-family="NanumGothic" font-size="15" font-weight="400" fill="#51657A" text-anchor="start">잘못된 소스가 운영에 나가면 고객 업무에 바로 영향</text><rect x="838.0" y="314" width="171.515" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="923.7574999999999" y="336.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">휴대폰 인증 오류</text><path d="M 1016.515,332 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 1025.5149999999999,327 L 1032.5149999999999,332 L 1025.5149999999999,337 Z" fill="#8496A8"/><rect x="1039.5149999999999" y="314" width="128.115" height="36" rx="18" ry="18" fill="#F2F6F9" stroke="#E3E9EF" stroke-width="1"/><text x="1103.5724999999998" y="336.41" font-family="NanumGothic" font-size="14" font-weight="700" fill="#0F2D4A" text-anchor="middle">인증 불가</text><path d="M 1174.6299999999999,332 h 10" stroke="#8496A8" stroke-width="2" stroke-linecap="round"/><path d="M 1183.6299