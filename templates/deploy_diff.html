<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시나리오 배포 변경내용</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --ink:#1c2128; --dim:#6b7684;
  --add:#1a7f37; --addbg:#e6f4ea; --del:#c9252d; --delbg:#fdeaea;
  --mod:#9a6700; --modbg:#fff4d6; --flow:#0a58ca; --flowbg:#e7f0fd;
  --scr:#6f42c1; --scrbg:#f1ebfb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 "Malgun Gothic","맑은 고딕",-apple-system,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0;font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;
  cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{background:#f0f2f5}
.btn.primary{background:#0a58ca;border-color:#0a58ca;color:#fff;font-weight:600}
.btn.primary:hover{background:#0847a5}
.btn:disabled{opacity:.55;cursor:default}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.src{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;
  margin-bottom:16px;font-size:12.5px;color:var(--dim);display:flex;gap:24px;flex-wrap:wrap}
.src b{color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.c{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.c .n{font-size:22px;font-weight:700;line-height:1.2}
.c .l{font-size:12px;color:var(--dim);margin-top:2px}
.c.add .n{color:var(--add)} .c.del .n{color:var(--del)} .c.mod .n{color:var(--mod)}
.c.flow .n{color:var(--flow)} .c.scr .n{color:var(--scr)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 13px;
  cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input.f{border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;
  width:230px;font-family:inherit}
.file{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.fh{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fafbfc}
.fh:hover{background:#f2f4f7}
.fn{font-weight:600;font-size:14px}
.tag{font-size:11px;padding:2px 8px;border-radius:11px;font-weight:600}
.t-add{background:var(--addbg);color:var(--add)}
.t-del{background:var(--delbg);color:var(--del)}
.t-mod{background:var(--modbg);color:var(--mod)}
.t-flow{background:var(--flowbg);color:var(--flow)}
.t-scr{background:var(--scrbg);color:var(--scr)}
.fb{border-top:1px solid var(--line);padding:6px 16px 14px;display:none}
.file.open .fb{display:block}
.blk{border-left:3px solid var(--line);padding:10px 0 10px 13px;margin-top:12px}
.blk.b-add{border-color:var(--add)} .blk.b-del{border-color:var(--del)}
.blk.b-mod{border-color:var(--mod)}
.bt{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seq{font:11.5px ui-monospace,Consolas,monospace;color:var(--dim);
  background:#f0f2f5;padding:1px 6px;border-radius:4px}
.loc{font-size:12px;color:var(--dim);margin-top:3px}
.sec{margin-top:9px}
.sl{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--dim);margin-bottom:4px}
.ch{font-size:13px;padding:3px 0}
.ch .w{color:var(--dim)}
.old{color:var(--del)} .new{color:var(--add);font-weight:600}
ul.msgs{margin:2px 0 0;padding-left:17px} ul.msgs li{padding:1.5px 0;font-size:13px}
pre.diff{background:#fafbfc;border:1px solid var(--line);border-radius:6px;
  padding:9px 11px;overflow:auto;max-height:280px;margin:4px 0 0;
  font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre}
pre.diff .a{background:var(--addbg);color:var(--add);display:block}
pre.diff .d{background:var(--delbg);color:var(--del);display:block}
pre.diff .h{color:#8250df;display:block}
/* 화면 미리보기 */
.scrn{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.ph{width:224px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.ph .cap{font-size:11.5px;text-align:center;padding:4px;font-weight:700}
.ph.before .cap{background:var(--delbg);color:var(--del)}
.ph.after .cap{background:var(--addbg);color:var(--add)}
.ph .tpl{font-size:10.5px;color:var(--dim);padding:5px 9px;border-bottom:1px solid var(--line);
  background:#fafbfc;text-align:center}
.ph .body{padding:11px 10px;min-height:110px}
.ph .ttl{font-weight:700;font-size:13px;margin-bottom:7px}
.ph .txt{font-size:11.5px;color:#444;margin-bottom:5px;line-height:1.45}
.ph .b{display:block;border:1px solid #0a58ca;color:#0a58ca;border-radius:6px;
  padding:6px;text-align:center;font-size:12px;margin-top:6px;font-weight:600}
.ph .ret{font-size:9.5px;color:var(--dim);font-weight:400}
.ph .bot{border-top:1px solid var(--line);padding:4px 9px;font-size:10px;color:var(--dim);
  background:#fafbfc;text-align:center}
.empty{text-align:center;color:var(--dim);padding:56px 20px}
.warn{background:#fff4d6;border:1px solid #f0d089;color:#7a5200;
  border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.6}
.hint{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap}
/* 리뷰용 — 연관 시나리오 / 블록 전문 */
.rel{background:#f7f9fc;border:1px solid #dde3ec;border-radius:8px;
  padding:10px 13px;margin:10px 0 4px}
.rel .i{display:inline-block;margin:3px 7px 0 0;font-size:12px;background:#fff;
  border:1px solid var(--line);padding:2px 9px;border-radius:12px}
.rel .warnline{background:#fff4d6;border-radius:6px;padding:5px 8px;margin-top:5px}
.rel .warnline b{color:#7a5200}
.sl2{font-size:11px;font-weight:700;color:var(--dim);margin:8px 0 3px}
details.full{margin-top:10px}
details.full>summary{cursor:pointer;font-size:12.5px;color:var(--flow);
  padding:5px 0;user-select:none}
.fullwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media(max-width:820px){.fullwrap{grid-template-columns:1fr}}
.fullcol{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.fcap{font-size:11.5px;font-weight:700;padding:5px 10px;text-align:center}
.fcap.before{background:var(--delbg);color:var(--del)}
.fcap.after{background:var(--addbg);color:var(--add)}
.fbody{padding:9px 11px}
pre.code{background:#fafbfc;border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;overflow:auto;max-height:260px;margin:3px 0 0;
  font:11.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
code{background:#f0f2f5;padding:1px 5px;border-radius:4px;
  font:12px ui-monospace,Consolas,monospace}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #fff;
  border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--delbg);border:1px solid #f5c2c7;color:#842029;
  padding:12px 15px;border-radius:8px}
.touch{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.touch b{font-size:12.5px} .touch .i{display:inline-block;margin:4px 8px 0 0;font-size:12px;
  background:var(--scrbg);color:var(--scr);padding:3px 9px;border-radius:12px}
</style>
</head>
<body>
<header>
  <h1>시나리오 배포 변경내용</h1>
  <button class="btn primary" id="go">변경내용 확인</button>
  <button class="btn" id="re" title="캐시 무시하고 다시 수집·분석">강제 재분석</button>
  <button class="btn" id="cfgBtn" title="시나리오 경로/SSH 설정">⚙ 경로 설정</button>
  <span id="st" style="font-size:12.5px;color:var(--dim)"></span>
  <span id="pv" style="margin-left:auto;font-size:11.5px;color:var(--dim)"></span>
</header>

<!-- 시나리오 경로 설정 (config.json 의 scenario_deploy 블록) -->
<div id="cfgBox" style="display:none;margin:12px 18px;padding:14px 16px;border:1px solid #dfe3ea;
     border-radius:10px;background:#fbfcff;font-size:13px;">
  <div style="font-weight:700;margin-bottom:10px;">시나리오 경로 설정</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px;">
    <label>SSH 대상 <small style="color:#888">(예: ivradmin@10.19.20.11 또는 ssh config alias)</small>
      <input id="c_ssh" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>SSH 포트 <small style="color:#888">(기본 22)</small>
      <input id="c_port" type="number" min="1" max="65535" placeholder="22"
             style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>기준 경로 (base)
      <input id="c_base" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>운영 폴더명
      <input id="c_new" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>과거 폴더명
      <input id="c_old" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>하위 폴더 <small style="color:#888">(비우면 시나리오 폴더 자체 · OUTPUT 등 하위폴더 무시)</small>
      <input id="c_out" placeholder="(비움)" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>비교 대상 확장자 <small style="color:#888">(쉼표 구분 · 예: .xml)</small>
      <input id="c_ext" placeholder=".xml" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>뷰어 미러 env <small style="color:#888">(비우면 미러 안 함)</small>
      <input id="c_venv" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;"></label>
    <label>검증 방식
      <select id="c_verify" style="width:100%;padding:7px;border:1px solid #ccd2db;border-radius:6px;">
        <option value="hash">hash — 내용 해시까지 확인 (권장)</option>
        <option value="fast">fast — 크기+수정시각만</option>
      </select></label>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button class="btn primary" id="cfgSave">저장</button>
    <span id="cfgMsg" style="font-size:12.5px;color:var(--dim)"></span>
  </div>
  <div id="cfgPreview" style="margin-top:8px;font-size:12px;color:#888;font-family:monospace;
       white-space:pre-wrap;word-break:break-all;"></div>
</div>

<div class="wrap" id="out">
  <div class="empty">「변경내용 확인」을 누르면 과거 배포본과 현재 운영 배포본을 비교합니다.</div>
</div>

<script>
const $=s=>document.querySelector(s);
// 이 화면 파일의 버전. 헤더에 표시되므로, 브라우저가 예전 화면을 쓰고
// 있는지 눈으로 바로 확인할 수 있다(파일만 봐서는 알 수 없다).
const PAGE_VERSION = '2026-09-22h';
let REP=null, FILTER={flow:1,script:1,screen:1,struct:1,vars:1}, Q='';
// 파일 펼침 제어. 변경 블록이 HEAVY_BLOCKS 를 넘으면 렌더가 무거워지므로
// 그때만 앞 3개만 펼치고, '모두 펼치기'로 강제 전환할 수 있게 한다.
const HEAVY_BLOCKS = 400;
let EXPAND_ALL = true, OPEN_LIMIT = 1e9, FORCE_EXPAND = false;

async function run(force){
  const b=$('#go'), r=$('#re');
  b.disabled=r.disabled=true;
  $('#st').textContent='';
  $('#out').innerHTML='<div class="empty"><span class="spin" style="border-color:#888;border-top-color:transparent"></span> 원격 시나리오 수집 및 분석 중…</div>';
  try{
    const res=await fetch('/api/deploy/check'+(force?'?force=1':''));
    const j=await res.json();
    if(j.error){ $('#out').innerHTML='<div class="err"><b>오류</b><br>'+esc(j.error)+(j.path?'<br><small>'+esc(j.path)+'</small>':'')+'</div>'; return; }
    REP=j; render();
    $('#st').textContent=(j.cached?'캐시된 결과':'분석 '+(j.elapsed||0)+'초')+' · 재배포 '+(j.meta.redeploy_count||1)+'회차';
  }catch(e){ $('#out').innerHTML='<div class="err">요청 실패: '+esc(e.message)+'</div>'; }
  finally{ b.disabled=r.disabled=false; }
}
showPageVersion();   // 브라우저가 어떤 화면 파일을 쓰는지 즉시 표시
$('#go').onclick=()=>run(false);
$('#re').onclick=()=>run(true);

// ── 시나리오 경로 설정 ────────────────────────────────────
const CFG_FIELDS={ssh:'c_ssh',ssh_port:'c_port',base:'c_base',new_dir:'c_new',
                  old_dir:'c_old',output_dir:'c_out',file_ext:'c_ext',
                  viewer_env:'c_venv',verify:'c_verify'};
function cfgFill(j){
  const c=j.config||{};
  for(const [k,id] of Object.entries(CFG_FIELDS)) $('#'+id).value=c[k]||'';
  const r=j.remote||{};
  const tgt=(c.ssh||'')+(c.ssh_port&&+c.ssh_port!==22?(' (포트 '+c.ssh_port+')'):'');
  $('#cfgPreview').textContent = r.new?('접속: '+tgt+'\n운영: '+r.new+'\n과거: '+r.old):'';
}
async function cfgLoad(){
  try{
    const j=await (await fetch('/api/deploy/config')).json();
    if(j.ok) cfgFill(j);
  }catch(e){ $('#cfgMsg').textContent='설정 조회 실패: '+e.message; }
}
$('#cfgBtn').onclick=()=>{
  const b=$('#cfgBox');
  const show=(b.style.display==='none');
  b.style.display=show?'block':'none';
  if(show) cfgLoad();
};
$('#cfgSave').onclick=async()=>{
  const body={};
  for(const [k,id] of Object.entries(CFG_FIELDS)) body[k]=$('#'+id).value;
  $('#cfgMsg').textContent='저장 중…';
  try{
    const res=await fetch('/api/deploy/config',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await res.json();
    if(!j.ok){ $('#cfgMsg').textContent='저장 실패: '+(j.error||''); return; }
    cfgFill(j);
    $('#cfgMsg').textContent='저장 완료 — 「강제 재분석」으로 새 경로를 적용하세요.';
  }catch(e){ $('#cfgMsg').textContent='저장 실패: '+e.message; }
};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function showPageVersion(){
  const e=document.getElementById('pv');
  if(e) e.textContent='화면 '+PAGE_VERSION;
}
function render(){
  const R=REP,S=R.summary,M=R.meta;
  let h='';

  // 한 번에 그릴 양을 가늠해 기본 펼침 여부를 정한다.
  const totalBlocks = (R.files||[]).reduce((a,f)=>a
      + (f.changed_blocks||[]).length + (f.added_blocks||[]).length
      + (f.removed_blocks||[]).length, 0);
  EXPAND_ALL = FORCE_EXPAND || totalBlocks <= HEAVY_BLOCKS;
  OPEN_LIMIT = EXPAND_ALL ? 1e9 : 3;
  const fm={full:'전체 수집',delta:'변경분만 수집',skip:'변경 없음'};
  h+='<div class="src"><span>기준(과거) <b>'+esc(M.old.path)+'</b> · '+M.old.files+'개 / '+M.old.mb+'MB'
    +' <i>('+(fm[M.old.fetch]||M.old.fetch)+(M.old.pulled?' '+M.old.pulled+'개':'')+')</i></span>'
    +'<span>대상(운영) <b>'+esc(M.new.path)+'</b> · '+M.new.files+'개 / '+M.new.mb+'MB'
    +' <i>('+(fm[M.new.fetch]||M.new.fetch)+(M.new.pulled?' '+M.new.pulled+'개':'')+')</i></span>'
    +'<span>생성 '+esc(M.generated)+'</span></div>';

  h+='<div class="cards">'
    +card(S.files_changed,'변경된 시나리오','mod')
    +card(S.files_added,'추가된 시나리오','add')
    +card(S.files_removed,'삭제된 시나리오','del')
    +card(S.blocks_modified,'변경 블록','mod')
    +card(S.blocks_added,'추가 블록','add')
    +card(S.blocks_removed,'삭제 블록','del')
    +card(S.flow_changes,'흐름 변화','flow')
    +card(S.screen_changes,'화면 변경','scr')
    +card(S.var_changes||0,'변수 · 값 변경','mod')
    +'</div>';

  if(R.screens_touched && R.screens_touched.length){
    h+='<div class="touch"><b>영향받은 보이는ARS 화면</b><br>';
    R.screens_touched.forEach(s=>h+='<span class="i">'+esc(s.code)+(s.name?' · '+esc(s.name):'')+'</span>');
    h+='</div>';
  }

  // 백엔드가 상한(MAX_BLOCK_CHANGES)에 걸려 뒷부분을 버렸으면 반드시 알린다.
  // 이걸 안 보여주면 '변경이 없다'와 '너무 많아 잘렸다'가 구별되지 않는다.
  if(S.truncated){
    h+='<div class="warn">⚠ 변경이 너무 많아 리포트가 중간에서 잘렸습니다. '
      +'아래 목록은 전체가 아닙니다. 필터나 검색으로 범위를 좁혀 확인하세요.</div>';
  }

  h+='<div class="bar">'
    +chip('flow','업무 흐름')+chip('script','함수처리')+chip('screen','보이는ARS 화면')
    +chip('struct','블록 추가·삭제')+chip('vars','변수 · 값')
    +'<input class="f" id="q" placeholder="시나리오/블록 검색" value="'+esc(Q)+'">'
    +'<button class="btn" id="ex">'+(EXPAND_ALL?'모두 접기':'모두 펼치기')+'</button></div>';

  if(!EXPAND_ALL){
    h+='<div class="warn">변경 블록이 '+totalBlocks+'개라 화면이 무거워질 수 있어 '
      +'앞 3개 시나리오만 펼쳐 두었습니다. 파일 제목을 클릭하거나 '
      +'<b>모두 펼치기</b>를 누르면 전체 내용을 볼 수 있습니다.</div>';
  }

  if(R.added_files.length||R.removed_files.length){
    h+='<div class="file open"><div class="fh"><span class="fn">시나리오 파일 추가 / 삭제</span></div><div class="fb">';
    R.added_files.forEach(f=>h+='<div class="ch"><span class="tag t-add">추가</span> '+esc(f.file)+' <span class="w">('+f.blocks+' 블록)</span></div>');
    R.removed_files.forEach(f=>h+='<div class="ch"><span class="tag t-del">삭제</span> '+esc(f.file)+' <span class="w">('+f.blocks+' 블록)</span></div>');
    h+='</div></div>';
  }

  let shown=0;
  R.files.forEach((f,i)=>{ const b=fileHtml(f,i); if(b){h+=b;shown++;} });
  if(!shown && !R.added_files.length && !R.removed_files.length)
    h+='<div class="empty">표시할 변경사항이 없습니다.</div>';

  $('#out').innerHTML=h;
  document.querySelectorAll('.fh').forEach(e=>e.onclick=()=>e.parentElement.classList.toggle('open'));
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{FILTER[c.dataset.k]=!FILTER[c.dataset.k];render();});
  const q=$('#q'); if(q){ q.oninput=()=>{Q=q.value;render();
    const n=$('#q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length);}; }
  const ex=$('#ex'); if(ex) ex.onclick=()=>{
    // 접힌 상태였다면 강제로 전체 펼침으로 전환하고 다시 그린다
    if(!EXPAND_ALL){ FORCE_EXPAND=true; render(); return; }
    // 이미 전부 펼쳐져 있으면 접는다
    FORCE_EXPAND=false; EXPAND_ALL=false; OPEN_LIMIT=0;
    document.querySelectorAll('.file').forEach(e=>e.classList.remove('open'));
    ex.textContent='모두 펼치기';
  };
}
function card(n,l,c){return '<div class="c '+c+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function chip(k,l){return '<span class="chip'+(FILTER[k]?' on':'')+'" data-k="'+k+'">'+l+'</span>';}

function fileHtml(f,i){
  const q=Q.trim().toLowerCase();
  let blocks='',n=0;
  if(FILTER.struct){
    f.added_blocks.forEach(b=>{const x=briefHtml(b,'add');if(match(f,b,q)){blocks+=x;n++;}});
    f.removed_blocks.forEach(b=>{const x=briefHtml(b,'del');if(match(f,b,q)){blocks+=x;n++;}});
  }
  f.changed_blocks.forEach(b=>{
    const x=changeHtml(b); if(x&&match(f,b,q)){blocks+=x;n++;}
  });
  if(FILTER.flow && f.link_changes.length){
    let l='';
    f.link_changes.forEach(c=>{ l+='<div class="ch"><span class="tag '+(c.kind==='added'?'t-add">추가':'t-del">삭제')+'</span> '
      +'연결 '+esc(c.from)+' → '+esc(c.to)+(c.label?' <span class="w">['+esc(c.label)+']</span>':'')+'</div>'; });
    if(l && (!q || f.file.toLowerCase().includes(q))){
      blocks+='<div class="blk b-mod"><div class="bt">흐름 연결 변경</div><div class="sec">'+l+'</div></div>'; n++;
    }
  }
  if(!n) return '';
  const c=f.counts;
  let tags='';
  if(c.changed) tags+='<span class="tag t-mod">변경 '+c.changed+'</span>';
  if(c.added) tags+='<span class="tag t-add">추가 '+c.added+'</span>';
  if(c.removed) tags+='<span class="tag t-del">삭제 '+c.removed+'</span>';
  if(c.links) tags+='<span class="tag t-flow">연결 '+c.links+'</span>';
  // 예전에는 앞 3개 파일만 펼쳤다. 나머지는 파일명과 개수 배지만 보여서
  // '개수만 나오고 내용은 안 보인다'가 됐다. 기본은 전부 펼친다.
  // (변경 블록이 너무 많으면 한 화면에 다 그리면 느려지므로 그때만 접는다)
  const openByDefault = (EXPAND_ALL || i < OPEN_LIMIT);
  return '<div class="file'+(openByDefault?' open':'')+'"><div class="fh"><span class="fn">'+esc(f.file)+'</span>'+tags
    + (openByDefault?'':'<span class="hint">클릭하여 내용 보기</span>')
    +'</div><div class="fb">'+relHtml(f)+blocks+'</div></div>';
}
function match(f,b,q){ if(!q) return true;
  return (f.file+' '+(b.label||'')+' '+(b.seq||'')).toLowerCase().includes(q); }

// 이 시나리오를 건드리면 어디에 영향이 가는가 — 배포 리뷰의 핵심
function relHtml(f){
  const r=f.related; if(!r) return '';
  const list=(arr,key)=>(arr||[]).map(x=>'<span class="i">'+esc(x.file)
      +' <span class="w">('+(x[key]||[]).join(', ')+')</span></span>').join('');
  const a=list(r.called_by,'from_blocks'), b=list(r.goes_to,'from_blocks'),
        c=list(r.direct_refs,'refs');
  if(!a && !b && !c) return '';
  let h='<div class="rel"><div class="sl">연관 시나리오 — 이 파일을 바꾸면 함께 확인할 곳</div>';
  if(a) h+='<div class="ch"><span class="w">이 시나리오를 호출 →</span> '+a+'</div>';
  if(b) h+='<div class="ch"><span class="w">여기서 넘어가는 곳 →</span> '+b+'</div>';
  if(c) h+='<div class="ch warnline"><span class="w">변경된 블록을 직접 지목 →</span> '+c
        +' <b>영향 확인 필요</b></div>';
  return h+'</div>';
}

function briefHtml(b,kind){
  let h='<div class="blk b-'+kind+'"><div class="bt"><span class="tag t-'+kind+'">'
    +(kind==='add'?'블록 추가':'블록 삭제')+'</span>'+esc(b.label||b.type)
    +' <span class="seq">'+esc(b.seq)+'</span></div>';
  if(b.location) h+=loc(b.location);
  if(b.target) h+='<div class="ch"><span class="w">이동 →</span> '+esc(b.target)+'</div>';
  if(b.cond) h+='<div class="ch"><span class="w">조건</span> <code>'+esc(b.cond)+'</code></div>';
  if(b.screens&&b.screens.length&&FILTER.screen){
    h+='<div class="sec"><div class="sl">보이는ARS 화면</div><div class="scrn">';
    b.screens.forEach(s=>h+=phone(s,kind==='add'?'after':'before',
      (s.code||'')+(s.name?' · '+s.name:''),s.title,[],s.buttons||[]));
    h+='</div></div>';
  }
  // 추가/삭제된 블록도 전문과 흐름 위치를 함께 — 새로 넣은 로직을 읽을 수 있게
  h+=varsHtml(b)+ctxHtml(b)+fullHtml(b);
  return h+'</div>';
}
function loc(l){
  const p=(l.menu_path||[]).join(' › ');
  return '<div class="loc">업무 위치: '+esc(p)+(l.step_title?' · STEP '+l.step_no+' '+esc(l.step_title):'')+'</div>';
}

// 변수 단위 변경 — '무슨 값을 건드렸나'. 줄 diff 보다 먼저 보여준다.
function varsHtml(b){
  if(!FILTER.vars || !b.vars || !b.vars.length) return '';
  const K={added:['추가','t-add'],removed:['삭제','t-del'],changed:['변경','t-mod']};
  let s='';
  b.vars.forEach(v=>{
    const k=K[v.kind]||['변경','t-mod'];
    s+='<div class="ch"><span class="tag '+k[1]+'">'+k[0]+'</span> '
      +'<code>'+esc(v.name)+'</code> ';
    if(v.kind==='changed') s+='<span class="old">'+esc(v.from)+'</span> → <span class="new">'+esc(v.to)+'</span>';
    else if(v.kind==='added') s+='= <span class="new">'+esc(v.to)+'</span>';
    else s+='<span class="old">'+esc(v.from)+'</span>';
    s+='</div>';
  });
  return '<div class="sec"><div class="sl">변수 · 값 변경</div>'+s+'</div>';
}

// 이 블록의 앞뒤 연결 — 흐름상 어디에 끼어 있는지
function ctxHtml(b){
  const c=b.context; if(!c) return '';
  const fmt=a=>(a||[]).map(x=>esc(x.label||'')+' <span class="seq">'+esc(x.seq)+'</span>'
      +(x.via?' <span class="w">['+esc(x.via)+']</span>':'')).join(' , ') || '<span class="w">없음</span>';
  return '<div class="sec"><div class="sl">흐름 위치</div>'
    +'<div class="ch"><span class="w">이 블록으로 ←</span> '+fmt(c.in)+'</div>'
    +'<div class="ch"><span class="w">이 블록에서 →</span> '+fmt(c.out)+'</div></div>';
}

// 블록 전문 — 변경 전/후를 통째로. 리뷰어가 흐름을 그대로 읽을 수 있게.
function fullHtml(b){
  const f=b.full; if(!f) return '';
  const one=(x,cap,cls)=>{
    if(!x) return '<div class="fullcol"><div class="fcap '+cls+'">'+cap+'</div>'
      +'<div class="w" style="padding:8px">(없음)</div></div>';
    let r='<div class="fullcol"><div class="fcap '+cls+'">'+cap+'</div><div class="fbody">';
    const row=(k,v)=>v?'<div class="ch"><span class="w">'+k+'</span> '+esc(v)+'</div>':'';
    r+=row('블록명',x.label)+row('종류',x.type)+row('주석',x.comment);
    r+=row('조건',x.cond)+row('이동 대상',x.target)+row('이동 노드',x.target_node);
    r+=row('ResultCase',x.result_case)+row('반환',x.ret);
    if(x.prescript) r+='<div class="sl2">PreScript</div><pre class="code">'+esc(x.prescript)+'</pre>';
    if(x.script) r+='<div class="sl2">Script</div><pre class="code">'+esc(x.script)+'</pre>';
    const wm=Object.keys(x.wv_meta||{});
    if(wm.length){ r+='<div class="sl2">화면 변수</div>';
      wm.sort().forEach(k=>r+='<div class="ch"><span class="w">'+esc(k)+'</span> '+esc(x.wv_meta[k])+'</div>'); }
    return r+'</div></div>';
  };
  return '<details class="full"><summary>블록 전문 보기 (변경 전 / 변경 후)</summary>'
    +'<div class="fullwrap">'+one(f.before,'변경 전','before')+one(f.after,'변경 후','after')
    +'</div></details>';
}

function changeHtml(b){
  let inner='';
  inner+=varsHtml(b);
  if(FILTER.flow && b.flow){
    let s='';
    b.flow.forEach(c=>{ s+='<div class="ch"><span class="w">'+esc(c.what)+'</span> '
      +'<span class="old">'+esc(c.from)+'</span> → <span class="new">'+esc(c.to)+'</span></div>'; });
    inner+='<div class="sec"><div class="sl">업무 흐름</div>'+s+'</div>';
  }
  if(FILTER.screen && b.screen){
    inner+='<div class="sec"><div class="sl">보이는ARS 화면</div><ul class="msgs">';
    b.screen.msgs.forEach(m=>inner+='<li>'+esc(m)+'</li>');
    inner+='</ul><div class="scrn">';
    const bf=b.screen.before||[], af=b.screen.after||[];
    const n=Math.max(bf.length,af.length);
    for(let i=0;i<n;i++){
      if(bf[i]) inner+=phone(bf[i],'before','변경 전',bf[i].title,bf[i].texts,bf[i].buttons);
      if(af[i]) inner+=phone(af[i],'after','변경 후',af[i].title,af[i].texts,af[i].buttons);
    }
    inner+='</div></div>';
  }
  if(FILTER.screen && b.wv_meta){
    let s='';
    b.wv_meta.forEach(c=>{ s+='<div class="ch"><span class="w">'+esc(c.what)+'</span> '
      +'<span class="old">'+esc(c.from)+'</span> → <span class="new">'+esc(c.to)+'</span></div>'; });
    inner+='<div class="sec"><div class="sl">화면/멘트 설정</div>'+s+'</div>';
  }
  if(FILTER.script && b.scripts){
    b.scripts.forEach(sc=>{
      inner+='<div class="sec"><div class="sl">함수처리 · '+esc(sc.title)
        +' <span style="color:var(--add)">+'+sc.added+'</span> <span style="color:var(--del)">-'+sc.removed+'</span></div><pre class="diff">';
      sc.lines.forEach(l=>{
        const c=l.startsWith('+')?'a':l.startsWith('-')?'d':l.startsWith('@')?'h':'';
        inner+=c?'<span class="'+c+'">'+esc(l)+'</span>':esc(l)+'\n';
      });
      inner+='</pre></div>';
    });
  }
  if(!inner) return '';
  let h='<div class="blk b-mod"><div class="bt">'+esc(b.label||b.type)
    +' <span class="seq">'+esc(b.seq)+'</span>';
  if(b.flow) h+='<span class="tag t-flow">흐름</span>';
  if(b.screen) h+='<span class="tag t-scr">화면</span>';
  if(b.scripts) h+='<span class="tag t-mod">함수</span>';
  if(b.vars) h+='<span class="tag t-mod">변수 '+b.vars.length+'</span>';
  h+='</div>';
  if(b.location) h+=loc(b.location);
  return h+inner+ctxHtml(b)+fullHtml(b)+'</div>';
}

function phone(s,cls,cap,title,texts,btns){
  let h='<div class="ph '+cls+'"><div class="cap">'+esc(cap)+'</div>';
  h+='<div class="tpl">'+esc(s.code||'-')+(s.name?' · '+esc(s.name):'')+'</div><div class="body">';
  if(title) h+='<div class="ttl">'+esc(title)+'</div>';
  (texts||[]).forEach(t=>h+='<div class="txt">'+esc(t)+'</div>');
  (btns||[]).forEach(b=>{
    const lab=b.label!==undefined?b.label:String(b);
    const ret=b.ret!==undefined?b.ret:'';
    h+='<div class="b">'+esc(lab)+(ret?' <span class="ret">'+esc(ret)+'</span>':'')+'</div>';
  });
  h+='</div>';
  const f=s.flags||{};
  if(f.BOT||f.BTNF) h+='<div class="bot">하단 '+esc(f.BOT||'')+(f.BTNF?' · 상담원 '+esc(f.BTNF):'')+'</div>';
  return h+'</div>';
}
</script>
</body>
</html>
